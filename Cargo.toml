[workspace]
resolver = "2"
members = ["crates/fs-syntax", "crates/fs-interp", "crates/fscript"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yepher/feature-script-parser"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
indexmap = "2"
